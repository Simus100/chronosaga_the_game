[package]
name = "parametric-ai-adventure"
version = "0.1.0"
description = "Chronosaga: The Game Windows desktop runtime"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sysinfo = "0.39.6"
