services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: parametric_game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d parametric_game"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [game]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://game:game@db:5432/parametric_game
      AI_MODE: procedural
    depends_on:
      db:
        condition: service_healthy
    networks: [game]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    networks: [game]

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]
    networks: [game]

networks:
  game:

volumes:
  pgdata:
